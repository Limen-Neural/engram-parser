name: Docker Build

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image (CPU-only)
    permissions:
      contents: read
      packages: write
    # Standard GitHub runners (no self-hosted GPU for this CPU-only crate)
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set Docker tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="${REPO}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,${REPO}:main"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS,${REPO}:pr-${{ github.event.number }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (only on main push for publish)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          # No build-args needed (CPU-only, stable Rust in Dockerfile)
          cache-from: type=gha
          cache-to: type=gha,mode=max
